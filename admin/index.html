<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공지 관리 | 나인투자</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../n-logo-core.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.css">
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="../index.html">
        <img src="../n-logo-core.svg" alt="" width="40" height="40">
        <strong>나인투자</strong>
      </a>
      <nav class="site-nav" id="site-nav" aria-label="관리자 메뉴">
        <a href="../pages/news/index.html">공지사항 보기</a>
        <a href="../index.html">홈으로</a>
      </nav>
      <button class="nav-toggle" type="button" aria-label="메뉴 열기" aria-controls="site-nav"><span></span></button>
    </div>
  </header>

  <main class="admin" id="main">
    <div class="container">
      <div class="admin__panel">
        <h1>공지 관리</h1>
        <p>관리자 키를 아는 사람만 공지를 저장할 수 있습니다. 저장하면 GitHub에 기록된 뒤 사이트가 자동으로 다시 배포됩니다.</p>

        <div class="admin__group">
          <div class="field">
            <label for="adminKey">관리자 키</label>
            <input id="adminKey" type="password" placeholder="Vercel 환경변수 ADMIN_KEY 값" autocomplete="off" />
            <p class="field__help">이 키는 브라우저에 저장되지 않습니다.</p>
          </div>
        </div>

        <div class="admin__group">
          <h2>고정 공지</h2>
          <div class="field">
            <label for="pinnedBody">고정 공지 내용</label>
            <textarea id="pinnedBody"></textarea>
            <p class="field__help">메인 화면과 공지사항 페이지 맨 위에 똑같이 나옵니다. 줄을 바꾸면 문단이 나뉩니다.</p>
          </div>
        </div>

        <div class="admin__group">
          <h2>새 공지 쓰기</h2>
          <div class="field-row">
            <div class="field">
              <label for="itemTitle">제목</label>
              <input id="itemTitle" type="text" placeholder="예) 설 연휴 운영 안내" />
            </div>
            <div class="field">
              <label for="itemDate">등록일</label>
              <input id="itemDate" type="date" />
            </div>
          </div>
          <div class="field">
            <label for="itemContent">내용</label>
            <textarea id="itemContent"></textarea>
            <p class="field__help">첫 줄은 메인 화면 목록에 요약으로 나옵니다.</p>
          </div>

          <div class="admin__actions">
            <button class="btn btn--secondary" type="button" id="btnLoad">다시 불러오기</button>
            <button class="btn btn--secondary" type="button" id="btnAdd">목록에 추가</button>
            <button class="btn btn--primary" type="button" id="btnSave">저장하고 배포</button>
          </div>
          <p class="admin__status" id="status" role="status">대기 중</p>
        </div>

        <div class="admin__group" aria-labelledby="preview-title">
          <h2 id="preview-title">현재 공지 목록</h2>
          <ul class="admin__list" id="previewList"></ul>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/site.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const statusEl = $('status');
    const listEl = $('previewList');
    const state = { data: null };

    const setStatus = (msg) => { statusEl.textContent = msg; };

    const renderList = () => {
      const items = Array.isArray(state.data?.items) ? state.data.items : [];
      listEl.innerHTML = items
        .slice(0, 30)
        .map((it) => {
          const date = (it.date || '').toString();
          const title = (it.title || '').toString();
          const esc = (v) => v.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `<li><strong>${esc(title)}</strong><small>${esc(date)}</small></li>`;
        })
        .join('');
    };

    const load = async () => {
      setStatus('불러오는 중...');
      const res = await fetch('/api/notices', { cache: 'no-store' });
      if (!res.ok) throw new Error('공지 데이터를 불러오지 못했습니다.');
      state.data = await res.json();
      $('pinnedBody').value = state.data?.pinnedNotice?.body ?? '';
      renderList();
      setStatus('불러오기 완료');
    };

    const add = () => {
      if (!state.data) state.data = { pinnedNotice: { title: 'NOTICE', updatedAt: '', body: '' }, items: [] };
      if (!Array.isArray(state.data.items)) state.data.items = [];

      const title = $('itemTitle').value.trim();
      const date = $('itemDate').value || new Date().toISOString().slice(0, 10);
      const content = $('itemContent').value.trim();

      if (!title || !content) {
        setStatus('제목/내용을 입력하세요.');
        return;
      }

      state.data.items.unshift({
        id: `notice-${Date.now()}`,
        date,
        title,
        content
      });

      $('itemTitle').value = '';
      $('itemContent').value = '';
      renderList();
      setStatus('공지 추가됨(아직 저장 전)');
    };

    const save = async () => {
      const key = $('adminKey').value.trim();
      if (!key) {
        setStatus('관리자 키를 입력하세요.');
        return;
      }
      if (!state.data) {
        setStatus('저장할 데이터가 없습니다. 먼저 불러오기 하세요.');
        return;
      }

      state.data.pinnedNotice = state.data.pinnedNotice || { title: 'NOTICE' };
      state.data.pinnedNotice.title = 'NOTICE';
      state.data.pinnedNotice.updatedAt = new Date().toISOString().slice(0, 10);
      state.data.pinnedNotice.body = $('pinnedBody').value;

      setStatus('저장(배포) 요청 중...');
      const res = await fetch('/api/notices', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Key': key
        },
        body: JSON.stringify(state.data)
      });

      if (!res.ok) {
        const t = await res.text();
        throw new Error(t);
      }
      setStatus('저장 요청 완료. GitHub 커밋 후 Vercel이 자동으로 재배포됩니다.');
    };

    $('btnLoad').addEventListener('click', () => load().catch((e) => setStatus(`오류: ${e.message}`)));
    $('btnAdd').addEventListener('click', add);
    $('btnSave').addEventListener('click', () => save().catch((e) => setStatus(`오류: ${e.message}`)));

    // 최초 로드
    load().catch(() => setStatus('불러오기를 눌러 공지 데이터를 가져오세요.'));
  </script>
</body>
</html>
